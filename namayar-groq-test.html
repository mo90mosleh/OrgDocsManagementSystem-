<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تست اتصال نمایار به Groq</title><style>body{background:#f5f7fa;font:15px Tahoma,Arial;color:#182947;padding:20px}main{max-width:650px;background:#fff;border:1px solid #e1e5e9;border-radius:16px;padding:24px;margin:25px auto}label{display:block;margin:15px 0 7px}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #c7d3df;border-radius:10px;font:inherit}textarea{height:105px}button{padding:12px 22px;border:0;border-radius:10px;background:#173254;color:white;font:inherit;margin:15px 0}#result{background:#eff3f9;padding:16px;border-radius:10px;line-height:2;white-space:pre-wrap}p{line-height:2;color:#526071}a{color:#1763af}</style></head><body><main><h2>آزمایش اتصال نمایار به Groq</h2><p>این صفحه آزمایشی است و نمایار اصلی را تغییر نمی‌دهد. کلید Groq را وارد نکن؛ فقط کد تست موقت خودت را بزن.</p><form id="form"><label>کد تست Supabase</label><input id="token" type="password" autocomplete="off" minlength="24" required><label>سؤال</label><textarea id="question" maxlength="1200">سلام نمایار! فرق فرآیند و گردش‌کار چیه؟ ساده و دوستانه توضیح بده.</textarea><button id="submit">تست Groq</button></form><h3>پاسخ</h3><div id="result">هنوز درخواست ارسال نشده است.</div><p>اگر خطایی دیدی، متن خطا را بفرست؛ کلید و کد تست را نفرست.</p><a href="./#/dashboard">برگشت به نما</a></main><script>document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("submit"),out=document.getElementById("result");b.disabled=true;out.textContent="در حال پردازش…";try{const r=await fetch("https://oozwypufxjkpamkdygjm.supabase.co/functions/v1/namayar-groq-test",{method:"POST",headers:{"Content-Type":"application/json","x-namayar-test-token":document.getElementById("token").value.trim()},body:JSON.stringify({question:document.getElementById("question").value,context:{path:"/dashboard",pageType:"dashboard",title:"داشبورد",entity:null}}),signal:AbortSignal.timeout(28000)});const d=await r.json();out.textContent=r.ok?(d.paragraphs||[]).join("\n\n"):["خطا "+r.status,d.message,d.provider_status?"کد Groq: "+d.provider_status:"",d.model?"مدل: "+d.model:"",d.provider_code,d.provider_message].filter(Boolean).join("\n");}catch(err){out.textContent="خطای اتصال: "+(err?.message||"خطای شبکه")}finally{b.disabled=false;}})</script></body></html>
