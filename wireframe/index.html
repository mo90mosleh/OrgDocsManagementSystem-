<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>وایرفریم محصول | پرتال فرآیندها</title>
<style>
:root{--ink:#1d283b;--soft:#6c798d;--line:#e2e7ed;--page:#f4f6f9;--white:#fff;--brand:#bd2739;--brandlight:#faeef0;--slate:#112237;--shadow:0 8px 28px #2332490b}*{box-sizing:border-box}body{margin:0;background:var(--page);font-family:Tahoma,"Noto Sans Arabic",sans-serif;color:var(--ink);font-size:13px;line-height:1.85}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--slate);color:#d7dfeb;display:flex;flex-direction:column;padding:26px 16px;gap:16px}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px;border-bottom:1px solid #ffffff18}.brandmark{width:42px;height:42px;border-radius:13px;background:var(--brand);color:white;font-size:25px;font-weight:900;display:grid;place-items:center}.brand strong{display:block;font-size:17px;color:#fff}.brand small{color:#95a9c5;font-size:10px}.aside-label{font-size:10px;color:#8297b4;margin:10px 14px 2px}.nav{display:flex;align-items:center;gap:12px;text-align:right;width:100%;background:transparent;border:0;color:#c5d2e2;border-radius:10px;padding:11px 12px}.nav:hover{background:#ffffff10}.nav.active{background:#ffffff17;color:#fff}.nav.active:before{content:"";width:3px;height:18px;border-radius:2px;background:#f17a84;position:absolute;right:16px}.symbol{width:22px;text-align:center;font-size:17px}.sidebottom{margin-top:auto;font-size:11px;color:#93a8c3;padding:14px;border-top:1px solid #ffffff15}.sidebottom strong{display:block;color:#e8eef7}.main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);padding:0 38px;display:flex;align-items:center;justify-content:space-between;gap:16px}.trail{color:var(--soft);font-size:12px}.user{display:flex;align-items:center;gap:9px;color:#536278}.avatar{width:34px;height:34px;border:1px solid #dfe4e8;border-radius:12px;display:grid;place-items:center;background:#f7f9fb}.page{max-width:1390px;margin:auto;padding:32px 38px 64px}.preview-note{background:#fffbeb;border:1px solid #f1e2ae;color:#6d5b29;border-radius:10px;padding:9px 14px;margin-bottom:23px;font-size:11px;display:flex;gap:9px;align-items:center}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}.heading h1{font-size:25px;line-height:1.5;margin:0 0 6px;font-weight:800}.heading p{margin:0;color:var(--soft);font-size:12px}.primary,.secondary,.ghost{border-radius:9px;border:1px solid transparent;padding:9px 15px;display:inline-flex;align-items:center;gap:7px;justify-content:center;font-weight:700;white-space:nowrap}.primary{background:var(--brand);color:white}.secondary{background:#fff;color:#27344a;border-color:#d9e0e8}.ghost{background:transparent;color:#58667b}.primary:hover{filter:brightness(.95)}.secondary:hover{background:#fafbfc}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:23px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:21px 22px;box-shadow:var(--shadow)}.stat .label{font-size:11px;color:var(--soft)}.stat .value{font-size:31px;display:block;margin-top:10px;line-height:1.2;font-weight:900}.stat .meta{font-size:10px;color:#95a0af;display:block;margin-top:8px}.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,0.65fr);gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}.panelhead{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panelhead strong{font-size:14px}.panelbody{padding:20px 21px}.empty{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;background-image:radial-gradient(#e6eaf0 1px,transparent 1px);background-size:18px 18px}.empty:has(.primary){min-height:330px}.empty h3{font-size:15px;margin:0;font-weight:800;background:white;padding:0 7px}.empty p{font-size:12px;color:var(--soft);max-width:360px;margin:0;background:#ffffffed;padding:4px 12px;border-radius:5px}.roundIcon{width:52px;height:52px;border:1px solid #e5dfdf;background:var(--brandlight);color:var(--brand);display:grid;place-items:center;border-radius:16px;font-size:25px}.ghostrow{border:1px dashed #d8dfe8;background:#fbfcfd;border-radius:11px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0}.ghostrow b{font-size:12px}.muted{color:var(--soft);font-size:11px}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{border:1px solid #e0e6ec;background:white;border-radius:12px;padding:15px;text-align:right}.action strong{display:block;margin-bottom:5px}.action small{color:var(--soft)}.action:hover{border-color:var(--brand)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar .space{flex:1}.tabrow{border-bottom:1px solid var(--line);display:flex;gap:5px;padding:0 16px;overflow-x:auto}.tab{border:0;background:transparent;padding:15px 11px;color:#728096;white-space:nowrap}.tab.active{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:700}.dataheader{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-bottom:1px solid #e9eef3;background:#f9fafb;padding:12px 16px;color:#738198;font-size:11px}.blanktable{padding:65px 20px;text-align:center;color:var(--soft)}.badge{font-size:10px;padding:4px 9px;background:#f1f4f8;color:#66778e;border-radius:7px}.dotted{border:2px dashed #d8e0e8;background:#fcfdfe;border-radius:13px;padding:26px}.miniinput{border:1px solid #dbe3ec;border-radius:8px;padding:10px 13px;color:#97a2b2;background:white;min-height:42px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:#59687e;font-weight:700}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #dbe2ea;border-radius:9px;padding:10px;background:#fff;color:#24334b;outline:0;width:100%;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--brand)}.modalshade{position:fixed;inset:0;background:#102031a8;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}.modalshade.open{display:flex}.modal{width:min(580px,95vw);max-height:89vh;overflow:auto;border-radius:16px;background:white;box-shadow:0 22px 85px #0004}.modalhead{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalhead strong{font-size:18px}.modalbody{padding:22px 24px}.modalfoot{display:flex;justify-content:flex-end;gap:10px;padding:18px 24px;border-top:1px solid var(--line)}.iconbtn{border:0;background:transparent;color:#617088;font-size:22px}.miniTag{font-size:10px;color:#9ba5b6;letter-spacing:.04em}.notice{margin-top:16px;font-size:11px;color:#79869a;background:#f7f9fc;border-radius:8px;padding:10px 14px}.hide{display:none!important}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.page{padding:22px}}@media(max-width:780px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:4;padding:10px 12px;display:block}.brand{padding:0;border:0}.brandmark{height:30px;width:30px;border-radius:8px;font-size:18px}.brand strong{font-size:14px}.brand small,.aside-label,.sidebottom{display:none}.navlist{display:flex;gap:4px;overflow-x:auto;margin-top:8px}.nav{white-space:nowrap;width:auto;padding:7px 9px;font-size:11px}.nav.active:before{display:none}.symbol{display:none}.topbar{height:50px;padding:0 18px}.page{padding:18px}.heading{align-items:flex-start}.heading h1{font-size:20px}.stats{gap:10px}.stat{padding:14px}.stat .value{font-size:25px}.formgrid{grid-template-columns:1fr}.action-grid{grid-template-columns:1fr}.preview-note{font-size:10px}}
</style>
</head>
<body>
<div class="layout">
 <aside class="sidebar"><div class="brand"><div class="brandmark">ف</div><div><strong>پرتال فرآیندها</strong><small>وایرفریم نسخه اولیه محصول</small></div></div><div class="aside-label">مدیریت سازمان</div><nav class="navlist" id="nav">
  <button class="nav active" data-view="dashboard"><span class="symbol">▦</span> داشبورد</button>
  <button class="nav" data-view="org"><span class="symbol">♧</span> چارت سازمانی</button>
  <button class="nav" data-view="architecture"><span class="symbol">▧</span> معماری فرآیندها</button>
  <button class="nav" data-view="processes"><span class="symbol">☷</span> کاتالوگ فرآیندها</button>
  <button class="nav" data-view="kpis"><span class="symbol">◈</span> شاخص‌های عملکرد</button>
  <button class="nav" data-view="settings"><span class="symbol">⚙</span> تنظیمات</button>
  </nav><div class="sidebottom"><strong>طرح اولیه بدون داده</strong>در این پیش‌نمایش هیچ داده سازمانی یا فرآیندی ثبت نشده است.</div>
 </aside>
 <main class="main"><header class="topbar"><div class="trail" id="crumb">پرتال فرآیندها / داشبورد</div><div class="user"><span class="miniTag">WIREFRAME • V0.5</span><div class="avatar">◯</div></div></header>
 <div class="page"><div class="preview-note">◇ این فایل تنها وایرفریم قابل مرور است؛ فرم‌ها و دکمه‌ها به دیتابیس متصل نیستند و هیچ داده‌ای ذخیره نمی‌شود.</div><div id="content"></div></div>
 </main>
</div>
<div id="modalshade" class="modalshade" role="dialog" aria-modal="true" aria-label="پیش‌نمایش فرم"><div class="modal"><div class="modalhead"><strong id="modal-title">فرم</strong><button class="iconbtn" onclick="closeModal()" aria-label="بستن">×</button></div><div class="modalbody" id="modalbody"></div><div class="modalfoot"><button class="secondary" onclick="closeModal()">بستن</button><button class="primary" onclick="showNonSaving()">ثبت در محصول اصلی</button></div></div></div>
<script>
const config={dashboard:{name:'داشبورد',desc:'مروری بر اطلاعات واقعی ثبت‌شده در سازمان'},org:{name:'چارت سازمانی',desc:'واحدها، سمت‌ها و افراد را اینجا تعریف و به هم متصل می‌کنید'},architecture:{name:'معماری فرآیندها',desc:'معماری L0، زنجیره‌های کاری L1 و فرآیندهای L2+ را بسازید'},processes:{name:'کاتالوگ فرآیندها',desc:'مرجع واحد برای ثبت و جست‌وجوی فرآیندها'},processDetail:{name:'اجزای یک فرآیند',desc:'پیش‌نمایش ساختار صفحه فرآیند پس از ایجاد اولین فرآیند'},kpis:{name:'مدیریت KPI',desc:'تعریف مستقل شاخص‌ها، الزامات داده و اندازه‌گیری اختیاری'},settings:{name:'تنظیمات سازمان',desc:'برندینگ و مدیریت کاربران و مجوزها'}};
function action(text,form){return `<button class="primary" onclick="openForm('${form}')">＋ ${text}</button>`}
function head(name,desc,right=''){return `<div class="heading"><div><h1>${name}</h1><p>${desc}</p></div>${right}</div>`}
function panel(title,body,extra=''){return `<section class="panel"><div class="panelhead"><strong>${title}</strong>${extra}</div>${body}</section>`}
function empty(title,description,button=''){return `<div class="empty"><div class="roundIcon">＋</div><h3>${title}</h3><p>${description}</p>${button}</div>`}
function viewDashboard(){return `${head('داشبورد','اطلاعات سازمان پس از ورود واقعی داده‌ها در اینجا دیده می‌شود')}
<div class="stats">${[['واحدهای سازمانی','۰'],['فرآیندهای ثبت‌شده','۰'],['شاخص‌های عملکرد','۰'],['مستندات فرآیندی','۰']].map(([l,n])=>`<div class="stat"><span class="label">${l}</span><span class="value">${n}</span><span class="meta">داده‌ای ثبت نشده است</span></div>`).join('')}</div><div class="cols">${panel('شروع کار',`<div class="panelbody"><div class="action-grid"><button class="action" onclick="go('org')"><strong>۱. ایجاد ساختار سازمانی</strong><small>واحد، سمت و شخص را تعریف کنید</small></button><button class="action" onclick="go('architecture')"><strong>۲. تعریف معماری فرآیند</strong><small>گروه‌ها و سطوح معماری را بسازید</small></button><button class="action" onclick="go('processes')"><strong>۳. ثبت نخستین فرآیند</strong><small>ثبت اولیه فقط به کد و عنوان نیاز دارد</small></button><button class="action" onclick="go('kpis')"><strong>۴. تعریف شاخص عملکرد</strong><small>حتی بدون داده اندازه‌گیری قابل ایجاد است</small></button></div></div>`)}${panel('آخرین فعالیت‌ها',empty('فعالیتی ثبت نشده است','بعد از شروع ورود اطلاعات، فعالیت‌های اخیر در اینجا نمایش داده می‌شوند.'))}</div>`}
function viewOrg(){return `${head('چارت سازمانی',config.org.desc,action('افزودن واحد','unit'))}<div class="toolbar"><button class="secondary" onclick="openForm('position')">افزودن سمت</button><button class="secondary" onclick="openForm('person')">افزودن شخص</button><button class="secondary" onclick="openForm('assignment')">تخصیص شخص به سمت</button><span class="space"></span><span class="muted">نمای چارت • امکان Zoom / Pan در محصول</span></div>${panel('ساختار سازمان',empty('هنوز واحدی تعریف نشده است','پس از ایجاد اولین واحد، ساختار درختی سازمان در این قسمت نمایش داده می‌شود.',action('ایجاد اولین واحد','unit')))}`}
function viewArchitecture(){return `${head('معماری فرآیندها',config.architecture.desc,action('ایجاد گره جدید','node'))}<div class="toolbar"><button class="secondary">نمای گراف</button><button class="secondary" onclick="go('processes')">نمای کاتالوگ</button><span class="space"></span><span class="badge">L0 / L1 / L2+</span><span class="badge">اصل داده: ساختار سلسله‌مراتبی</span></div>${panel('نقشه معماری',empty('هنوز هیچ گره‌ای در معماری وجود ندارد','برای شروع، یک گروه فرآیندی یا فرآیند واقعی ایجاد کنید. تمام سطوح به مرور اضافه می‌شوند.',action('افزودن گروه یا فرآیند','node')))}`}
function viewProcesses(){return `${head('کاتالوگ فرآیندها',config.processes.desc,action('ایجاد فرآیند','process'))}<div class="toolbar"><span class="miniinput" style="flex:1;min-width:170px">جست‌وجوی کد یا عنوان فرآیند</span><span class="miniinput">همه طبقه‌بندی‌ها ▾</span><button class="secondary" onclick="go('processDetail')">پیش‌نمایش صفحه فرآیند</button></div>${panel('فهرست فرآیندها',`<div class="dataheader"><span>کد فرآیند</span><span>عنوان</span><span>مالک</span><span>وضعیت مستندات</span></div><div class="blanktable"><div class="roundIcon" style="margin:0 auto 9px">☷</div><strong>هیچ فرآیندی ثبت نشده است.</strong><div style="margin:12px">${action('ثبت نخستین فرآیند','process')}</div></div>`)}`}
function viewKpis(){return `${head('شاخص‌های عملکرد (KPI)',config.kpis.desc,action('تعریف KPI','kpi'))}<div class="toolbar"><span class="miniinput" style="flex:1">جست‌وجوی کد یا عنوان KPI</span><span class="miniinput">وضعیت آمادگی داده ▾</span></div>${panel('فرهنگ شاخص‌ها',`<div class="dataheader"><span>کد</span><span>عنوان شاخص</span><span>مالک</span><span>وضعیت داده</span></div><div class="blanktable"><div class="roundIcon" style="margin:0 auto 9px">◈</div><strong>هنوز شاخصی تعریف نشده است.</strong><p>تعریف KPI به داشتن مقدار عملکردی وابسته نیست.</p><div style="margin:12px">${action('تعریف شاخص جدید','kpi')}</div></div>`)}`}
function viewSettings(){return `${head('تنظیمات سازمان',config.settings.desc)}<div class="cols">${panel('هویت سازمان و برند',`<div class="panelbody formgrid"><div class="field full"><label>نام سازمان</label><input placeholder="پس از ثبت سازمان واقعی نمایش داده می‌شود"></div><div class="field"><label>رنگ اصلی برند</label><input type="color" value="#bd2739" oninput="document.documentElement.style.setProperty('--brand',this.value)"></div><div class="field"><label>لوگو</label><input type="file" accept="image/*"></div><div class="field full"><span class="notice">تغییر رنگ در این وایرفریم فقط موقت است؛ داده‌ای ذخیره نمی‌شود.</span></div></div>`)}${panel('کاربران و دسترسی‌ها',`<div class="panelbody"><div class="ghostrow"><div><b>حساب‌های کاربری</b><div class="muted">پس از راه‌اندازی مدیر، حساب‌ها اینجا فهرست می‌شوند.</div></div></div><div class="ghostrow"><div><b>نقش‌های پایه</b><div class="muted">مدیر / ویرایشگر / مشاهده‌گر</div></div></div><button class="secondary" onclick="openForm('user')">افزودن کاربر</button></div>`)}</div>`}
let activeTab='overview'; const tabs=[['overview','نمای کلی'],['profile','شناسنامه'],['model','مدل BPMN'],['relations','ارتباطات'],['kpi','KPIها'],['docs','مستندات'],['optional','اختیاری']];
function detailTab(){switch(activeTab){case 'profile':return empty('شناسنامه هنوز تکمیل نشده است','هدف، آغاز/پایان، ورودی/خروجی و نقش‌ها اختیاری هستند.',action('ویرایش شناسنامه','profile'));case 'model':return empty('مدل BPMN ثبت نشده است','در محصول واقعی از bpmn-js برای ایجاد، ورود و ویرایش XML استفاده می‌شود.',action('افزودن مدل','bpmn'));case 'relations':return empty('ارتباط فرآیندی ثبت نشده است','ارتباطات جانبی مستقل از سلسله‌مراتب معماری ثبت می‌شوند.',action('تعریف ارتباط','relation'));case 'kpi':return empty('KPI مرتبط ثبت نشده است','می‌توانید KPI موجود را متصل کنید یا شاخص جدید تعریف کنید.',action('تعریف KPI','kpi'));case 'docs':return empty('مستندی ثبت نشده است','فایل یا لینک منبع به فرآیند متصل می‌شود.',action('افزودن سند','doc'));case 'optional':return `<div class="panelbody"><div class="ghostrow"><div><b>ماتریس RACI</b><div class="muted">جدول اختیاری، بدون موتور نقش‌ها و قوانین پیچیده</div></div><button class="secondary" onclick="openForm('raci')">افزودن ردیف</button></div><div class="ghostrow"><div><b>ماتریس حدود اختیار</b><div class="muted">جدول ساده موضوع، سمت، نوع اختیار و شرط</div></div><button class="secondary" onclick="openForm('authority')">افزودن ردیف</button></div></div>`;default:return empty('ابتدا یک فرآیند واقعی ایجاد کنید','پس از ثبت فرآیند، تمام قسمت‌های اختیاری آن از همین صفحه در دسترس خواهند بود.') }}
function viewProcessDetail(){return `${head('جزئیات فرآیند',config.processDetail.desc)}<div class="notice" style="margin:0 0 15px">این صفحه فقط ساختار تب‌ها را نشان می‌دهد و هیچ فرآیندی ایجاد یا جعل نشده است.</div><div class="panel"><div class="tabrow">${tabs.map(([id,name])=>`<button class="tab ${activeTab===id?'active':''}" onclick="activeTab='${id}';render()">${name}</button>`).join('')}</div>${detailTab()}</div>`}
const renderers={dashboard:viewDashboard,org:viewOrg,architecture:viewArchitecture,processes:viewProcesses,processDetail:viewProcessDetail,kpis:viewKpis,settings:viewSettings};let current='dashboard';
function go(id){current=id;document.getElementById('crumb').textContent='پرتال فرآیندها / '+config[id].name;document.querySelectorAll('.nav').forEach(el=>el.classList.toggle('active',el.dataset.view===id));render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.getElementById('content').innerHTML=renderers[current]();}
document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>go(btn.dataset.view)));
const input=(label,placeholder='',full=false)=>`<div class="field ${full?'full':''}"><label>${label}</label><input placeholder="${placeholder||label}"></div>`;
const forms={unit:{title:'تعریف واحد سازمانی',fields:[input('عنوان واحد'),input('کد واحد (اختیاری)'),input('واحد بالادستی (اختیاری)','انتخاب از واحدهای ثبت‌شده',true)]},position:{title:'تعریف سمت',fields:[input('عنوان سمت'),input('واحد سازمانی'),input('سمت بالادستی (اختیاری)','انتخاب از سمت‌های ثبت‌شده',true)]},person:{title:'تعریف شخص',fields:[input('نام و نام خانوادگی'),input('ایمیل (اختیاری)'),input('شماره تماس (اختیاری)')]},assignment:{title:'تخصیص شخص به سمت',fields:[input('انتخاب شخص'),input('انتخاب سمت')]},node:{title:'ایجاد گره معماری',fields:[`<div class="field"><label>نوع گره</label><select><option>گروه فرآیندی</option><option>فرآیند</option></select></div>`,input('عنوان'),input('کد فرآیند (برای نوع فرآیند)'),input('والد (اختیاری)')]},process:{title:'تعریف فرآیند',fields:[input('کد فرآیند'),input('عنوان فرآیند'),input('گروه بالادستی (اختیاری)'),input('مالک فرآیند (اختیاری)')]},kpi:{title:'تعریف شاخص عملکرد',fields:[input('کد KPI'),input('عنوان شاخص'),input('فرمول (اختیاری)','فرمول متنی'),input('واحد سنجش (اختیاری)'),input('تناوب اندازه‌گیری (اختیاری)'),input('منبع داده (اختیاری)'),input('مالک (اختیاری)'),input('فرآیندهای مرتبط (اختیاری)', '',true)]},user:{title:'افزودن کاربر',fields:[input('نام کاربری'),input('آدرس ایمیل'),`<div class="field"><label>نقش</label><select><option>مشاهده‌گر</option><option>ویرایشگر</option><option>مدیر</option></select></div>`]},profile:{title:'ویرایش شناسنامه',fields:[input('هدف فرآیند','',true),input('نقطه آغاز'),input('نقطه پایان'),input('ورودی‌ها','',true),input('خروجی‌ها','',true)]},bpmn:{title:'مدل فرآیند',fields:[`<div class="field full"><label>منبع مدل BPMN</label><input type="file" accept=".bpmn,.xml"></div>`,`<p class="muted">در محصول اصلی، این قسمت ویرایشگر bpmn-js خواهد داشت؛ در وایرفریم هیچ موتور یا فایل ذخیره نمی‌شود.</p>`]},relation:{title:'تعریف رابطه فرآیند',fields:[input('فرآیند مقصد'),input('نوع رابطه')]},doc:{title:'پیوست سند',fields:[input('عنوان سند'),`<div class="field full"><label>فایل</label><input type="file"></div>`]},raci:{title:'ردیف RACI (اختیاری)',fields:[input('فعالیت'),input('نقش/سمت'),`<div class="field"><label>نوع مسئولیت</label><select><option>R — مجری</option><option>A — پاسخگو</option><option>C — مشاور</option><option>I — مطلع</option></select></div>`]},authority:{title:'ردیف حدود اختیار (اختیاری)',fields:[input('موضوع تصمیم'),input('نقش/سمت'),input('نوع اختیار'),input('شرط یا حدود (اختیاری)')]}};
function openForm(name){const form=forms[name]||forms.process;document.getElementById('modal-title').textContent=form.title;document.getElementById('modalbody').innerHTML=`<div class="formgrid">${form.fields.join('')}</div><div class="notice">برای ذخیره واقعی، باید نسخه اجرایی توسط Codex ساخته شود. این پیش‌نمایش داده وارد نمی‌کند.</div>`;document.getElementById('modalshade').classList.add('open')}
function closeModal(){document.getElementById('modalshade').classList.remove('open')}
function showNonSaving(){alert('این فقط وایرفریم طراحی است؛ هیچ اطلاعاتی ذخیره نشد. در محصول واقعی این فرم به API امن متصل خواهد شد.')}
document.getElementById('modalshade').addEventListener('click',e=>{if(e.target.id==='modalshade')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});go('dashboard');
</script>
