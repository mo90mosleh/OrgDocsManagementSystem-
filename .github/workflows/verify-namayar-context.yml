name: Verify Namayar question routing and product guide
on:
  push:
    branches:
      - fix/namayar-general-platform-context-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - name: Install
        working-directory: presentation
        run: npm ci
      - name: Typecheck portal
        working-directory: presentation
        run: npm run typecheck
      - name: Build public and private artifacts
        working-directory: presentation
        run: npm run build:pages
      - name: Test conversations and platform guide
        working-directory: presentation
        run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge gateway and shared guide
        working-directory: presentation
        run: deno check supabase/functions/namayar-groq-test/index.ts
